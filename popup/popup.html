<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Screen OCR Vocabulary</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Screen OCR</h1>
      <p class="subtitle">拖动选择、即时翻译、自动收藏</p>
    </header>

    <div id="api-warning" class="warning hidden">
      尚未设定 Gemini API Key，请先打开设定页
    </div>

    <div class="shortcut-hint">
      快捷键：<kbd id="shortcut-key">Ctrl+Shift+O</kbd>
    </div>

    <div class="buttons">
      <button id="open-wordlist" class="btn btn-primary">
        <span class="icon">📚</span>
        <span>打开单词列表</span>
      </button>
      <button id="open-settings" class="btn btn-secondary">
        <span class="icon">⚙️</span>
        <span>设定</span>
      </button>
    </div>

    <footer>
      <button id="start-ocr" class="btn-link">
        在当前标签页启动 OCR
      </button>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
